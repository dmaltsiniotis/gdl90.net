name: Release Library

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore gdl90.sln

      - name: Publish GDL90.Core
        run: dotnet publish GDL90.Core/GDL90.Core.csproj --configuration Release --no-restore --output ./artifacts/GDL90.Core /p:DebugSymbols=false /p:DebugType=none

      - name: Publish GDL90.Adapters
        run: dotnet publish GDL90.Adapters/GDL90.Adapters.csproj --configuration Release --no-restore --output ./artifacts/GDL90.Adapters /p:DebugSymbols=false /p:DebugType=none

      - name: Package release artifacts
        run: |
          mkdir -p ./artifacts
          zip -j ./artifacts/GDL90-libraries-release.zip ./artifacts/GDL90.Core/* ./artifacts/GDL90.Adapters/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          generate_release_notes: true
          files: |
            ./artifacts/GDL90-libraries-release.zip